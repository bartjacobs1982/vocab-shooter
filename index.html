<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isaline's Eenhoorn Woordenspel</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; overflow: hidden; touch-action: none; height: 100%; }
        body {
            background: linear-gradient(180deg, #FFD8EC 0%, #E3C9FF 45%, #C6B6FF 100%);
            color: #4A2E6B;
            font-family: 'Baloo 2', 'Nunito', -apple-system, sans-serif;
        }
        canvas { display: block; }

        .hud {
            position: absolute;
            top: 18px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        .prompt-label {
            font-size: 15px;
            font-weight: 600;
            color: #7A4FBF;
            letter-spacing: 0.3px;
        }
        .prompt-word {
            font-family: 'Baloo 2', sans-serif;
            font-size: 34px;
            font-weight: 800;
            color: #FF6FA5;
            margin-top: 2px;
            text-shadow: 0 2px 0 #ffffff, 0 4px 10px rgba(255,111,165,0.45);
        }
        .score-board {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255,255,255,0.7);
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 17px;
            font-weight: 800;
            color: #7A4FBF;
            box-shadow: 0 3px 10px rgba(122,79,191,0.25);
            z-index: 10;
        }
        .name-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(255,255,255,0.7);
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: 700;
            color: #FF6FA5;
            box-shadow: 0 3px 10px rgba(255,111,165,0.25);
            z-index: 10;
        }

        .start-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at 50% 30%, #FFE8F6 0%, #E3C9FF 55%, #C6B6FF 100%);
            z-index: 20;
            padding: 20px;
        }
        .start-screen .big-unicorn { font-size: 84px; margin-bottom: 6px; filter: drop-shadow(0 6px 10px rgba(122,79,191,0.35)); }
        .start-screen h1 { font-size: 30px; margin: 0 0 6px; color: #FF6FA5; text-shadow: 0 2px 0 #fff; }
        .start-screen p { font-size: 16px; margin: 4px 0 22px; color: #7A4FBF; max-width: 280px; }
        .start-btn {
            font-family: inherit;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(180deg, #FF9AC4, #FF6FA5);
            border: none;
            border-radius: 999px;
            padding: 16px 40px;
            box-shadow: 0 6px 0 #E14D85, 0 10px 18px rgba(255,111,165,0.4);
            pointer-events: auto;
        }
        .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #E14D85; }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const PLAYER_NAME = "Isaline";
        const CLOUD_COLORS = ['#FFD1E8', '#D9C6FF', '#C6EFFF', '#FFF0BF', '#C6FFDE'];
        const SPARKLE_COLORS = ['#FF6FA5', '#7A4FBF', '#FFC93C', '#4FD6C4'];

        function drawStar(ctx, cx, cy, r, color, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const outerAngle = (Math.PI * 2 * i) / 5 - Math.PI / 2;
                const innerAngle = outerAngle + Math.PI / 5;
                ctx.lineTo(cx + Math.cos(outerAngle) * r, cy + Math.sin(outerAngle) * r);
                ctx.lineTo(cx + Math.cos(innerAngle) * r * 0.45, cy + Math.sin(innerAngle) * r * 0.45);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawCloudShape(ctx, x, y, w, h) {
            const r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x - w / 2 + r, y);
            ctx.arc(x - w / 2 + r, y + r * 0.55, r * 0.9, Math.PI * 1.1, Math.PI * 1.9);
            ctx.arc(x, y - r * 0.15, r * 0.85, Math.PI, Math.PI * 2);
            ctx.arc(x + w / 2 - r, y + r * 0.55, r * 0.9, Math.PI * 1.25, Math.PI * 2.05);
            ctx.lineTo(x + w / 2, y + h);
            ctx.lineTo(x - w / 2, y + h);
            ctx.closePath();
        }

        function VocabShooter({ vocabulary }) {
            const canvasRef = useRef(null);
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [score, setScore] = useState(0);

            const gameState = useRef({
                playerX: window.innerWidth / 2,
                bullets: [],
                targets: [],
                feedbacks: [],
                confetti: [],
                sparkleTrail: [],
                bgStars: [],
                bgClouds: [],
                isTransitioning: false
            });

            const setupNewRound = (data) => {
                if (!data || data.length < 4) return;

                const randomIndex = Math.floor(Math.random() * data.length);
                const correctItem = data[randomIndex];

                const distractors = [];
                while (distractors.length < 3) {
                    const rand = data[Math.floor(Math.random() * data.length)];
                    if (rand.Dutch !== correctItem.Dutch && !distractors.includes(rand.Dutch)) {
                        distractors.push(rand.Dutch);
                    }
                }

                const options = [correctItem.Dutch, ...distractors].sort(() => Math.random() - 0.5);
                setCurrentQuestion({ french: correctItem.French, correctDutch: correctItem.Dutch });
                gameState.current.isTransitioning = false;

                const columnWidth = window.innerWidth / 4;
                gameState.current.targets = options.map((text, index) => ({
                    x: (index * columnWidth) + (columnWidth / 2),
                    y: 100,
                    text: text,
                    isCorrect: text === correctItem.Dutch,
                    width: Math.min(columnWidth - 6, 100),
                    height: 52,
                    speed: 0.5,
                    color: CLOUD_COLORS[index % CLOUD_COLORS.length],
                    bob: Math.random() * Math.PI * 2,
                    isDestroyed: false
                }));
            };

            useEffect(() => {
                setupNewRound(vocabulary);
            }, [vocabulary]);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationId;
                const state = gameState.current;

                // background twinkling stars
                for (let i = 0; i < 40; i++) {
                    state.bgStars.push({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight,
                        r: Math.random() * 1.5 + 0.5,
                        phase: Math.random() * Math.PI * 2
                    });
                }
                // background drifting clouds
                for (let i = 0; i < 5; i++) {
                    state.bgClouds.push({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight * 0.6,
                        w: 90 + Math.random() * 60,
                        speed: 0.15 + Math.random() * 0.15
                    });
                }

                const handleMove = (e) => {
                    if (e.touches && e.touches.length > 0) state.playerX = e.touches[0].clientX;
                    else if (e.clientX) state.playerX = e.clientX;
                };

                const handleShoot = (e) => {
                    handleMove(e);
                    state.bullets.push({
                        x: state.playerX,
                        y: window.innerHeight - 70,
                        speed: 8,
                        color: SPARKLE_COLORS[Math.floor(Math.random() * SPARKLE_COLORS.length)],
                        rot: Math.random() * Math.PI
                    });
                };

                window.addEventListener('touchmove', handleMove);
                window.addEventListener('mousemove', handleMove);
                window.addEventListener('touchstart', handleShoot);
                window.addEventListener('mousedown', handleShoot);

                let t = 0;

                const render = () => {
                    t += 0.05;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // twinkling stars
                    state.bgStars.forEach(s => {
                        const alpha = 0.4 + 0.4 * Math.sin(t + s.phase);
                        ctx.save();
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    });

                    // drifting background clouds
                    ctx.globalAlpha = 0.5;
                    state.bgClouds.forEach(c => {
                        drawCloudShape(ctx, c.x, c.y, c.w, c.w * 0.4);
                        ctx.fillStyle = '#ffffff';
                        ctx.fill();
                        c.x += c.speed;
                        if (c.x - c.w > window.innerWidth) c.x = -c.w;
                    });
                    ctx.globalAlpha = 1;

                    // sparkle trail behind unicorn
                    if (Math.random() < 0.6) {
                        state.sparkleTrail.push({
                            x: state.playerX + (Math.random() - 0.5) * 16,
                            y: window.innerHeight - 55,
                            r: Math.random() * 2.5 + 1,
                            alpha: 1,
                            color: SPARKLE_COLORS[Math.floor(Math.random() * SPARKLE_COLORS.length)]
                        });
                    }
                    for (let i = state.sparkleTrail.length - 1; i >= 0; i--) {
                        const sp = state.sparkleTrail[i];
                        sp.alpha -= 0.03;
                        sp.y += 0.3;
                        drawStar(ctx, sp.x, sp.y, sp.r, sp.color, Math.max(0, sp.alpha));
                        if (sp.alpha <= 0) state.sparkleTrail.splice(i, 1);
                    }

                    // Draw unicorn ship
                    const px = state.playerX;
                    const py = window.innerHeight - 55;
                    ctx.save();
                    ctx.font = '48px serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(255,111,165,0.5)';
                    ctx.shadowBlur = 12;
                    ctx.fillText('🦄', px, py);
                    ctx.restore();

                    // Update & Draw Bullets (magic sparkles)
                    for (let i = state.bullets.length - 1; i >= 0; i--) {
                        const b = state.bullets[i];
                        b.y -= b.speed;
                        b.rot += 0.2;
                        ctx.save();
                        ctx.translate(b.x, b.y);
                        ctx.rotate(b.rot);
                        drawStar(ctx, 0, 0, 6, b.color, 1);
                        ctx.restore();
                        if (b.y < 0) state.bullets.splice(i, 1);
                    }

                    // Update & Draw Targets (cloud word-bubbles)
                    state.targets.forEach((tgt) => {
                        if (tgt.isDestroyed) return;
                        tgt.y += tgt.speed;
                        tgt.bob += 0.06;
                        const wobbleY = tgt.y + Math.sin(tgt.bob) * 2;

                        drawCloudShape(ctx, tgt.x, wobbleY, tgt.width, tgt.height);
                        ctx.save();
                        ctx.shadowColor = 'rgba(122,79,191,0.25)';
                        ctx.shadowBlur = 8;
                        ctx.shadowOffsetY = 3;
                        ctx.fillStyle = tgt.color;
                        ctx.fill();
                        ctx.restore();
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = '#ffffff';
                        ctx.stroke();

                        ctx.fillStyle = '#4A2E6B';
                        ctx.font = '800 15px "Baloo 2", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(tgt.text, tgt.x, wobbleY + tgt.height / 2 + 2);
                    });

                    // Confetti burst
                    for (let i = state.confetti.length - 1; i >= 0; i--) {
                        const c = state.confetti[i];
                        c.x += c.vx; c.y += c.vy; c.vy += 0.15; c.alpha -= 0.02; c.rot += c.vr;
                        ctx.save();
                        ctx.globalAlpha = Math.max(0, c.alpha);
                        ctx.translate(c.x, c.y);
                        ctx.rotate(c.rot);
                        ctx.fillStyle = c.color;
                        ctx.fillRect(-3, -3, 6, 6);
                        ctx.restore();
                        if (c.alpha <= 0) state.confetti.splice(i, 1);
                    }

                    // Floating Feedback Text
                    for (let i = state.feedbacks.length - 1; i >= 0; i--) {
                        const f = state.feedbacks[i];
                        f.y -= 1.2; f.alpha -= 0.018;
                        ctx.save();
                        ctx.globalAlpha = Math.max(0, f.alpha);
                        ctx.fillStyle = f.color;
                        ctx.font = '800 20px "Baloo 2", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(f.text, f.x, f.y);
                        ctx.restore();
                        if (f.alpha <= 0) state.feedbacks.splice(i, 1);
                    }

                    // Collision Detection
                    for (let bIndex = state.bullets.length - 1; bIndex >= 0; bIndex--) {
                        const b = state.bullets[bIndex];
                        for (let tIndex = 0; tIndex < state.targets.length; tIndex++) {
                            const tgt = state.targets[tIndex];
                            if (!tgt.isDestroyed && b.x > tgt.x - tgt.width / 2 && b.x < tgt.x + tgt.width / 2 && b.y > tgt.y && b.y < tgt.y + tgt.height) {
                                state.bullets.splice(bIndex, 1);
                                tgt.isDestroyed = true;

                                if (tgt.isCorrect) {
                                    setScore(s => s + 10);
                                    state.feedbacks.push({ x: tgt.x, y: tgt.y, text: `+10 Bravo ${PLAYER_NAME}!`, color: '#3BB273', alpha: 1.0 });
                                    for (let c = 0; c < 24; c++) {
                                        const angle = Math.random() * Math.PI * 2;
                                        const speed = Math.random() * 4 + 1;
                                        state.confetti.push({
                                            x: tgt.x, y: tgt.y,
                                            vx: Math.cos(angle) * speed,
                                            vy: Math.sin(angle) * speed - 2,
                                            rot: 0, vr: (Math.random() - 0.5) * 0.4,
                                            alpha: 1,
                                            color: SPARKLE_COLORS[Math.floor(Math.random() * SPARKLE_COLORS.length)]
                                        });
                                    }
                                    if (!state.isTransitioning) {
                                        state.isTransitioning = true;
                                        setTimeout(() => setupNewRound(vocabulary), 1000);
                                    }
                                } else {
                                    setScore(s => Math.max(0, s - 5));
                                    state.feedbacks.push({ x: tgt.x, y: tgt.y, text: "Oeps, probeer opnieuw!", color: '#FF6F6F', alpha: 1.0 });
                                }
                                break;
                            }
                        }
                    }

                    animationId = requestAnimationFrame(render);
                };

                render();

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('touchmove', handleMove);
                    window.removeEventListener('mousemove', handleMove);
                    window.removeEventListener('touchstart', handleShoot);
                    window.removeEventListener('mousedown', handleShoot);
                };
            }, [vocabulary]);

            return (
                <div>
                    <div className="name-badge">🦄 {PLAYER_NAME}</div>
                    <div className="hud">
                        <div className="prompt-label">Vertaal naar het Nederlands, {PLAYER_NAME}:</div>
                        <div className="prompt-word">{currentQuestion ? currentQuestion.french : '...'}</div>
                    </div>
                    <div className="score-board">⭐ Score: {score}</div>
                    <canvas ref={canvasRef} width={window.innerWidth} height={window.innerHeight} />
                </div>
            );
        }

        function App() {
            const [vocabData, setVocabData] = useState([]);
            const [started, setStarted] = useState(false);
            const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5AyynEyE5XLtxjJI7mfIV7RxbFiOIPbLi35E4pT6-ZX5Jpkfokv3Hqi--PVV2xUSLBxf3Tcr8lEQy/pub?gid=0&single=true&output=csv";

            useEffect(() => {
                Papa.parse(sheetUrl, {
                    download: true, header: true,
                    complete: (results) => setVocabData(results.data.filter(item => item.French && item.Dutch))
                });
            }, []);

            if (!started) {
                return (
                    <div className="start-screen">
                        <div className="big-unicorn">🦄🌈</div>
                        <h1>Isaline's Eenhoorn Woordenspel</h1>
                        <p>Schiet de juiste Nederlandse vertaling van het Franse woord kapot en verdien sterren!</p>
                        {vocabData.length >= 4 ? (
                            <button className="start-btn" onClick={() => setStarted(true)}>Start het spel!</button>
                        ) : (
                            <p>Laden...</p>
                        )}
                    </div>
                );
            }

            return (
                <div>
                    {vocabData.length >= 4 ? <VocabShooter vocabulary={vocabData} /> : <div style={{ textAlign: 'center', marginTop: '40vh', color: '#7A4FBF' }}><h2>Laden...</h2></div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
