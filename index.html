<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frans-Nederlands Vocab Shooter</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; overflow: hidden; background: #0d0e15; color: #fff; font-family: -apple-system, sans-serif; touch-action: none; }
        canvas { display: block; }
        .hud { position: absolute; top: 15px; left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
        .prompt-label { font-size: 13px; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px; }
        .prompt-word { font-size: 26px; font-weight: bold; color: #63b3ed; margin-top: 4px; text-shadow: 0 0 10px rgba(99,179,237,0.4); }
        .score-board { position: absolute; top: 15px; right: 20px; font-size: 18px; font-weight: bold; color: #48bb78; z-index: 10; }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function VocabShooter({ vocabulary }) {
            const canvasRef = useRef(null);
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [score, setScore] = useState(0);

            const gameState = useRef({
                playerX: window.innerWidth / 2,
                bullets: [],
                targets: [],
                feedbacks: [],
                isTransitioning: false
            });

            const setupNewRound = (data) => {
                if (!data || data.length < 4) return;
                
                const randomIndex = Math.floor(Math.random() * data.length);
                const correctItem = data[randomIndex];
                
                const distractors = [];
                while (distractors.length < 3) {
                    const rand = data[Math.floor(Math.random() * data.length)];
                    if (rand.Dutch !== correctItem.Dutch && !distractors.includes(rand.Dutch)) {
                        distractors.push(rand.Dutch);
                    }
                }

                const options = [correctItem.Dutch, ...distractors].sort(() => Math.random() - 0.5);
                setCurrentQuestion({ french: correctItem.French, correctDutch: correctItem.Dutch });
                gameState.current.isTransitioning = false;

                const columnWidth = window.innerWidth / 4;
                gameState.current.targets = options.map((text, index) => ({
                    x: (index * columnWidth) + (columnWidth / 2),
                    y: 70,
                    text: text,
                    isCorrect: text === correctItem.Dutch,
                    width: Math.min(columnWidth - 10, 85),
                    height: 40,
                    speed: 0.5,
                    isDestroyed: false
                }));
            };

            useEffect(() => {
                setupNewRound(vocabulary);
            }, [vocabulary]);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationId;

                const handleMove = (e) => {
                    if (e.touches && e.touches.length > 0) gameState.current.playerX = e.touches[0].clientX;
                    else if (e.clientX) gameState.current.playerX = e.clientX;
                };

                const handleShoot = (e) => {
                    handleMove(e);
                    gameState.current.bullets.push({ x: gameState.current.playerX, y: window.innerHeight - 60, speed: 8 });
                };

                window.addEventListener('touchmove', handleMove);
                window.addEventListener('mousemove', handleMove);
                window.addEventListener('touchstart', handleShoot);
                window.addEventListener('mousedown', handleShoot);

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const state = gameState.current;

                    // Draw Ship
                    ctx.fillStyle = '#63b3ed';
                    ctx.beginPath();
                    ctx.moveTo(state.playerX, window.innerHeight - 60);
                    ctx.lineTo(state.playerX - 18, window.innerHeight - 25);
                    ctx.lineTo(state.playerX + 18, window.innerHeight - 25);
                    ctx.fill();

                    // Update & Draw Bullets
                    ctx.fillStyle = '#f6ad55';
                    for (let i = state.bullets.length - 1; i >= 0; i--) {
                        const b = state.bullets[i];
                        b.y -= b.speed;
                        ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
                        if (b.y < 0) state.bullets.splice(i, 1);
                    }

                    // Update & Draw Targets
                    state.targets.forEach((t) => {
                        if (t.isDestroyed) return;
                        t.y += t.speed;
                        ctx.fillStyle = '#2d3748';
                        ctx.strokeStyle = '#4a5568';
                        ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.roundRect(t.x - t.width/2, t.y, t.width, t.height, 8);
                        ctx.fill(); ctx.stroke();
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 12px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(t.text, t.x, t.y + 24);
                    });

                    // Update & Draw Floating Feedback Text
                    for (let i = state.feedbacks.length - 1; i >= 0; i--) {
                        const f = state.feedbacks[i];
                        f.y -= 1; f.alpha -= 0.02;
                        ctx.fillStyle = f.color;
                        ctx.globalAlpha = Math.max(0, f.alpha);
                        ctx.font = 'bold 16px sans-serif';
                        ctx.fillText(f.text, f.x, f.y);
                        ctx.globalAlpha = 1.0;
                        if (f.alpha <= 0) state.feedbacks.splice(i, 1);
                    }

                    // Collision Detection
                    for (let bIndex = state.bullets.length - 1; bIndex >= 0; bIndex--) {
                        const b = state.bullets[bIndex];
                        for (let tIndex = 0; tIndex < state.targets.length; tIndex++) {
                            const t = state.targets[tIndex];
                            if (!t.isDestroyed && b.x > t.x - t.width/2 && b.x < t.x + t.width/2 && b.y > t.y && b.y < t.y + t.height) {
                                state.bullets.splice(bIndex, 1);
                                t.isDestroyed = true;

                                if (t.isCorrect) {
                                    setScore(s => s + 10);
                                    state.feedbacks.push({ x: t.x, y: t.y, text: "+10", color: '#48bb78', alpha: 1.0 });
                                    
                                    if (!state.isTransitioning) {
                                        state.isTransitioning = true;
                                        setTimeout(() => setupNewRound(vocabulary), 1000);
                                    }
                                } else {
                                    setScore(s => Math.max(0, s - 5));
                                    state.feedbacks.push({ x: t.x, y: t.y, text: "Fout!", color: '#f56565', alpha: 1.0 });
                                }
                                break;
                            }
                        }
                    }

                    animationId = requestAnimationFrame(render);
                };

                render();

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('touchmove', handleMove);
                    window.removeEventListener('mousemove', handleMove);
                    window.removeEventListener('touchstart', handleShoot);
                    window.removeEventListener('mousedown', handleShoot);
                };
            }, [vocabulary]);

            return (
                <div>
                    <div className="hud">
                        <div className="prompt-label">Vertaal naar het Nederlands:</div>
                        <div className="prompt-word">{currentQuestion ? currentQuestion.french : '...'}</div>
                    </div>
                    <div className="score-board">Score: {score}</div>
                    <canvas ref={canvasRef} width={window.innerWidth} height={window.innerHeight} />
                </div>
            );
        }

        function App() {
            const [vocabData, setVocabData] = useState([]);
            const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5AyynEyE5XLtxjJI7mfIV7RxbFiOIPbLi35E4pT6-ZX5Jpkfokv3Hqi--PVV2xUSLBxf3Tcr8lEQy/pub?gid=0&single=true&output=csv"; 

            useEffect(() => {
                Papa.parse(sheetUrl, {
                    download: true, header: true,
                    complete: (results) => setVocabData(results.data.filter(item => item.French && item.Dutch))
                });
            }, []);

            return (
                <div>
                    {vocabData.length >= 4 ? <VocabShooter vocabulary={vocabData} /> : <div style={{ textAlign: 'center', marginTop: '40vh', color: '#a0aec0' }}><h2>Laden...</h2></div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
